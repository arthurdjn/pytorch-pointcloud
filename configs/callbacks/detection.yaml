# Default callbacks plus per-epoch 3D detection mAP at fixed IoU thresholds (indoor / nuScenes-mini
# protocol; VoteNet additionally uses its own group with the BN-momentum decay).
defaults:
  - default
  - val_map
  - _self_

# Detection selects checkpoints on the validation metric, not a loss (eval is metric-driven).
model_checkpoint:
  monitor: "val/mAP@0.25"
  mode: max
