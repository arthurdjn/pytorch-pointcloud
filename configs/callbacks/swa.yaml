# Default callbacks plus Stochastic Weight Averaging. Opt in with `callbacks=swa`.
# SWA averages weights over the tail of training, a reliable mIoU boost at no extra cost.
defaults:
  - default

stochastic_weight_averaging:
  _target_: lightning.pytorch.callbacks.StochasticWeightAveraging
  swa_lrs: 0.001  # SWA-phase LR; tune per experiment (lower for AdamW, higher for SGD)
  swa_epoch_start: 0.75  # begin weight averaging in the last 25% of training
