# Default callbacks plus per-epoch segmentation metrics, logged on validation/test.
# Each metric reads its class count from the model and `ignore_index` from the module criterion,
# so neither is duplicated here. Opt in with `override /callbacks: segmentation`.
defaults:
  - default

val_miou:
  _target_: torch_pointcloud.lightning.MetricCallback
  name: mIoU
  metric:
    _target_: torchmetrics.JaccardIndex
    _partial_: true
    task: multiclass

val_accuracy:
  _target_: torch_pointcloud.lightning.MetricCallback
  name: accuracy
  prog_bar: false
  metric:
    _target_: torchmetrics.Accuracy
    _partial_: true
    task: multiclass
