# Default callbacks plus per-epoch segmentation metrics, logged on validation/test.
# `num_classes` is interpolated from the experiment's `model.num_classes` and `ignore_index` from its
# `model.criterion` (null when the criterion has none, e.g. a SumLoss). Opt in with
# `override /callbacks: segmentation`.
defaults:
  - default

val_miou:
  _target_: torch_pointcloud.lightning.MetricCallback
  name: mIoU
  metric:
    _target_: torchmetrics.JaccardIndex
    task: multiclass
    num_classes: ${model.num_classes}
    ignore_index: ${oc.select:model.criterion.ignore_index,null}

val_accuracy:
  _target_: torch_pointcloud.lightning.MetricCallback
  name: accuracy
  prog_bar: false
  metric:
    _target_: torchmetrics.Accuracy
    task: multiclass
    num_classes: ${model.num_classes}
    ignore_index: ${oc.select:model.criterion.ignore_index,null}
