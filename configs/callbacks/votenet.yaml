# Default callbacks, plus per-epoch detection mAP and VoteNet's BatchNorm-momentum decay.
defaults:
  - default

model_checkpoint:
  monitor: "val/mAP@0.25"
  mode: max

mean_ap:
  _target_: torch_pointcloud.lightning.MetricCallback
  name: mAP
  stages: [val, test]
  metric:
    _target_: torch_pointcloud.lightning.MeanAveragePrecision3D
    iou_thresholds: [0.25, 0.5]

bn_momentum_scheduler:
  _target_: torch_pointcloud.lightning.BNMomentumScheduler
  bn_momentum_init: 0.5
  bn_decay_rate: 0.5
  bn_decay_step: 20
  bn_momentum_clip: 0.001
