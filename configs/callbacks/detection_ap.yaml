# Default callbacks plus per-class 3D AP at class-specific IoU thresholds (KITTI protocol);
# the experiment sets `callbacks.val_ap.metric.iou_per_class` / `class_names`.
defaults:
  - default
  - val_ap
  - _self_

# Detection selects checkpoints on the mean AP over classes, not a loss (eval is metric-driven).
model_checkpoint:
  monitor: "val/mAP"
  mode: max
