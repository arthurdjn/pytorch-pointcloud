# Main config for the Hydra training entrypoint `train.py` (benchmarks and checkpoint evaluation
# live in `test.py`):
#   uv run --no-sync python train.py experiment=spunet/scannet
#   uv run --no-sync python train.py experiment=spunet/scannet logger=csv
# `datamodule`, `model` and `experiment` are mandatory; every experiment overrides the first two.
defaults:
  - _self_
  - paths: default
  - hydra: default
  - trainer: default
  - callbacks: default
  - logger: default
  - datamodule: ???
  - model: ???
  - experiment: ???
  # Optional test-time inference strategy composed into `model.inferer` (e.g. `inferer=tta`).
  - inferer: null

task_name: train
tags: [dev]
# Friendly run tag; experiment configs override it, a CLI override wins.
run_name: default
# Captured once at compose time so the filesystem layout and the cross-backend `run_id` agree to the second.
timestamp: ${now:%Y-%m-%d_%H-%M-%S}
# Shared run id so the same run is correlatable across tracking backends (aim/mlflow/...).
run_id: ${run_name}_${timestamp}

seed: 42
# Run `Trainer.test` on the best checkpoint after the fit.
test: true
# Checkpoint to resume `Trainer.fit` from.
ckpt_path: null
