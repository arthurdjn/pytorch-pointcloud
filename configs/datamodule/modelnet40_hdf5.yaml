# ModelNet40 (pre-sampled HDF5, `modelnet40_ply_hdf5_2048`) classification datamodule. The reference
# evaluation protocol takes the first N points of each pre-shuffled 2048-point cloud (no FPS). The
# validation transform is the model's registered eval transform, pulled by the datamodule onto any
# dataset whose `transform` is null.
_target_: torch_pointcloud.lightning.PointCloudDataModule
batch_size: 32
num_workers: 8

train_dataset:
  _target_: torch_pointcloud.datasets.ModelNet40Hdf5
  root: ${paths.data_dir}
  train: true
  transform: null

val_dataset:
  _target_: torch_pointcloud.datasets.ModelNet40Hdf5
  root: ${paths.data_dir}
  train: false
  transform: null
