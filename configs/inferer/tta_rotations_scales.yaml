# @package model.inferer
# Indoor precise-eval protocol: 13 test-time views (4 z-rotations at scale 1.0, 0.95 and 1.05, plus an x/y flip)
# of a voxel-partition base that predicts every raw point (softmax summed over fragments and views, argmax at
# raw resolution). Rotations and the flip act on `pos` and `normal`, the scale on `pos` only. The experiment sets
# `base.voxel_size` and the per-fragment `base.transform` (feature stack, grid coordinates).

_target_: torch_pointcloud.inferers.TTAInferer
aggregate: mean
base:
  _target_: torch_pointcloud.inferers.VoxelPartitionInferer
  voxel_size: ???
  transform: ???
  softmax: true
  reduce: sum
  seed: 42
transforms:
  - _target_: torch_pointcloud.transforms.Compose
    transforms:
      - _target_: torch_pointcloud.transforms.RandomRotate
        keys: [pos, normal]
        angle_range: [0.0, 0.0]
        axis: 2
        p: 1.0
        allow_missing_keys: true
  - _target_: torch_pointcloud.transforms.Compose
    transforms:
      - _target_: torch_pointcloud.transforms.RandomRotate
        keys: [pos, normal]
        angle_range: [90.0, 90.0]
        axis: 2
        p: 1.0
        allow_missing_keys: true
  - _target_: torch_pointcloud.transforms.Compose
    transforms:
      - _target_: torch_pointcloud.transforms.RandomRotate
        keys: [pos, normal]
        angle_range: [180.0, 180.0]
        axis: 2
        p: 1.0
        allow_missing_keys: true
  - _target_: torch_pointcloud.transforms.Compose
    transforms:
      - _target_: torch_pointcloud.transforms.RandomRotate
        keys: [pos, normal]
        angle_range: [270.0, 270.0]
        axis: 2
        p: 1.0
        allow_missing_keys: true
  - _target_: torch_pointcloud.transforms.Compose
    transforms:
      - _target_: torch_pointcloud.transforms.RandomRotate
        keys: [pos, normal]
        angle_range: [0.0, 0.0]
        axis: 2
        p: 1.0
        allow_missing_keys: true
      - _target_: torch_pointcloud.transforms.RandomScale
        keys: pos
        scale_range: [0.95, 0.95]
        p: 1.0
  - _target_: torch_pointcloud.transforms.Compose
    transforms:
      - _target_: torch_pointcloud.transforms.RandomRotate
        keys: [pos, normal]
        angle_range: [90.0, 90.0]
        axis: 2
        p: 1.0
        allow_missing_keys: true
      - _target_: torch_pointcloud.transforms.RandomScale
        keys: pos
        scale_range: [0.95, 0.95]
        p: 1.0
  - _target_: torch_pointcloud.transforms.Compose
    transforms:
      - _target_: torch_pointcloud.transforms.RandomRotate
        keys: [pos, normal]
        angle_range: [180.0, 180.0]
        axis: 2
        p: 1.0
        allow_missing_keys: true
      - _target_: torch_pointcloud.transforms.RandomScale
        keys: pos
        scale_range: [0.95, 0.95]
        p: 1.0
  - _target_: torch_pointcloud.transforms.Compose
    transforms:
      - _target_: torch_pointcloud.transforms.RandomRotate
        keys: [pos, normal]
        angle_range: [270.0, 270.0]
        axis: 2
        p: 1.0
        allow_missing_keys: true
      - _target_: torch_pointcloud.transforms.RandomScale
        keys: pos
        scale_range: [0.95, 0.95]
        p: 1.0
  - _target_: torch_pointcloud.transforms.Compose
    transforms:
      - _target_: torch_pointcloud.transforms.RandomRotate
        keys: [pos, normal]
        angle_range: [0.0, 0.0]
        axis: 2
        p: 1.0
        allow_missing_keys: true
      - _target_: torch_pointcloud.transforms.RandomScale
        keys: pos
        scale_range: [1.05, 1.05]
        p: 1.0
  - _target_: torch_pointcloud.transforms.Compose
    transforms:
      - _target_: torch_pointcloud.transforms.RandomRotate
        keys: [pos, normal]
        angle_range: [90.0, 90.0]
        axis: 2
        p: 1.0
        allow_missing_keys: true
      - _target_: torch_pointcloud.transforms.RandomScale
        keys: pos
        scale_range: [1.05, 1.05]
        p: 1.0
  - _target_: torch_pointcloud.transforms.Compose
    transforms:
      - _target_: torch_pointcloud.transforms.RandomRotate
        keys: [pos, normal]
        angle_range: [180.0, 180.0]
        axis: 2
        p: 1.0
        allow_missing_keys: true
      - _target_: torch_pointcloud.transforms.RandomScale
        keys: pos
        scale_range: [1.05, 1.05]
        p: 1.0
  - _target_: torch_pointcloud.transforms.Compose
    transforms:
      - _target_: torch_pointcloud.transforms.RandomRotate
        keys: [pos, normal]
        angle_range: [270.0, 270.0]
        axis: 2
        p: 1.0
        allow_missing_keys: true
      - _target_: torch_pointcloud.transforms.RandomScale
        keys: pos
        scale_range: [1.05, 1.05]
        p: 1.0
  - _target_: torch_pointcloud.transforms.Compose
    transforms:
      - _target_: torch_pointcloud.transforms.RandomFlip
        keys: [pos, normal]
        axes: [0, 1]
        p: 1.0
        allow_missing_keys: true
