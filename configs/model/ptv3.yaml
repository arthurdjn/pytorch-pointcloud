# Point Transformer V3 LightningModule (Pointcept semseg-pt-v3m1-0-base).
# Caveats: PTv3 is class-targeted (not in the create_model registry);
# `use_flash_attn` needs the `flash-attn` extra.
_target_: torch_pointcloud.lightning.LitSegmentationModel
scheduler_interval: step
ignore_index: -1 # Relabel remaps raw labels 1-20 to 0-19 and unannotated to -1
mix_prob: 0.8 # Mix3D: probability of merging scene pairs per training batch

param_groups:
  # PTv3 transformer blocks at 0.1x base LR (Pointcept param_dicts).
  # MONAI-style: matchers + match_types + lr_values, in parallel lists.
  # Filter matchers take a parameter `name` and return bool, so fnmatch drops in.
  layer_matches:
    - _target_: fnmatch.fnmatchcase
      _partial_: true
      pat: "*block*"
  match_types: filter
  lr_values: 0.0006
  include_others: true

model:
  _target_: torch_pointcloud.models.PointTransformerV3Segmentation
  in_channels: 6
  num_classes: 20
  serialization_orders: [z, z-trans, hilbert, hilbert-trans]
  shuffle_serialization_orders: true
  strides: [2, 2, 2, 2]
  encoder_depths: [2, 2, 2, 6, 2]
  encoder_channels: [32, 64, 128, 256, 512]
  encoder_num_head: [2, 4, 8, 16, 32]
  encoder_patch_size: [1024, 1024, 1024, 1024, 1024]
  decoder_depths: [2, 2, 2, 2]
  decoder_channels: [256, 128, 64, 64]
  decoder_num_head: [16, 8, 4, 4]
  decoder_patch_size: [1024, 1024, 1024, 1024]
  mlp_ratio: 4
  qkv_bias: true
  qk_scale: null
  attn_drop: 0.0
  proj_drop: 0.0
  drop_path: 0.3
  attention: default
  use_flash_attn: true
  upcast_attention: false
  upcast_softmax: false

criterion:
  _target_: torch_pointcloud.losses.SumLoss
  losses:
    - _target_: torch.nn.CrossEntropyLoss
      ignore_index: -1
    - _target_: torch_pointcloud.losses.LovaszLoss
      ignore_index: -1
      loss_weight: 1.0

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.006
  weight_decay: 0.05

scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  _partial_: true
  _convert_: all # pass max_lr as a plain list, not an OmegaConf ListConfig
  max_lr: [0.006, 0.0006] # [default, block] groups, matching param_groups order
  total_steps: 80000 # override at the CLI, or use `${eval:"<expr>"}` via the resolver registered in train.py
  pct_start: 0.05
  anneal_strategy: cos
  div_factor: 10.0
  final_div_factor: 1000.0
