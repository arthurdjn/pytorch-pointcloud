# DGCNN LightningModule for part segmentation.
# DGCNN part-seg forward is model(x, pos, batch, category), so `category`
# is appended to input_keys.
_target_: torch_pointcloud.lightning.LitSegmentationModel
input_keys: [x, pos, batch, category]

model:
  _target_: torch_pointcloud.create_model
  name: dgcnn-antao.shapenetpart
  task: segmentation
  pretrained: false

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.006
  weight_decay: 0.05

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 100
