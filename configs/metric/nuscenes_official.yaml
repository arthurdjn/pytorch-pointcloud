# Official nuScenes detection protocol: distance-matched AP averaged over the 0.5/1/2/4 m thresholds,
# the five TP errors, and the NDS, over the 10 detection classes. The metric's `update` extras
# (`gt_velocity`, `gt_num_points`, `pred_attributes`, `gt_attributes`) refine the TP errors and the
# GT filtering; predictions additionally need their decoded `velocity` for the velocity error.
# Mount into the mAP callback from a benchmark experiment's defaults list:
# `- /metric@callbacks.val_map.metric: nuscenes_official`.

_target_: torch_pointcloud.lightning.NuScenesDetection
class_names:
  [car, truck, construction_vehicle, bus, trailer, barrier, motorcycle, bicycle, pedestrian, traffic_cone]
dist_thresholds: [0.5, 1.0, 2.0, 4.0]
tp_threshold: 2.0
max_boxes_per_sample: 500
