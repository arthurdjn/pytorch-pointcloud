# S3DIS semantic segmentation datamodule (Area-5 test split). Train on Areas 1-4 + 6,
# validate / benchmark on Area 5. Transforms live in the experiment configs (training) or
# come from the registered model (benchmark).
_target_: torch_pointcloud.lightning.PointCloudDataModule
batch_size: 4
num_workers: 8

train_dataset:
  _target_: torch_pointcloud.datasets.S3DIS
  root: ${paths.data_dir}
  areas: [Area_1, Area_2, Area_3, Area_4, Area_6]
  transform: null

val_dataset:
  _target_: torch_pointcloud.datasets.S3DIS
  root: ${paths.data_dir}
  areas: [Area_5]
  transform: null
