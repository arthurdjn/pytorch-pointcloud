# SemanticKITTI LiDAR semantic segmentation datamodule. Transforms live in the experiment
# configs (training) or come from the registered model (benchmark).
_target_: torch_pointcloud.lightning.PointCloudDataModule
batch_size: 2
num_workers: 8

train_dataset:
  _target_: torch_pointcloud.datasets.SemanticKITTI
  root: ${paths.data_dir}
  split: train
  transform: null

val_dataset:
  _target_: torch_pointcloud.datasets.SemanticKITTI
  root: ${paths.data_dir}
  split: val
  transform: null
