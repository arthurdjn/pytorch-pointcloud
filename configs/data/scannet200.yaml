# ScanNet200 (200-class) semantic segmentation datamodule. Transforms live in the
# experiment configs (training) or come from the registered model (benchmark).
_target_: torch_pointcloud.lightning.PointCloudDataModule
batch_size: 1
num_workers: 8

train_dataset:
  _target_: torch_pointcloud.datasets.ScanNet200
  root: ${paths.data_dir}
  split: train
  use_axis_alignment: false
  transform: null

val_dataset:
  _target_: torch_pointcloud.datasets.ScanNet200
  root: ${paths.data_dir}
  split: val
  use_axis_alignment: false
  transform: null
