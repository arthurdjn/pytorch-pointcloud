# ScanNet20 datamodule. Transforms are model-specific and live in the
# experiment configs (configs/experiment/), which override `transform`.
_target_: torch_pointcloud.lightning.PointCloudDataModule
batch_size: 12
num_workers: 8

train_dataset:
  _target_: torch_pointcloud.datasets.ScanNet20
  root: ${paths.data_dir}
  split: train
  use_axis_alignment: false
  transform: null

val_dataset:
  _target_: torch_pointcloud.datasets.ScanNet20
  root: ${paths.data_dir}
  split: val
  use_axis_alignment: false
  transform: null
