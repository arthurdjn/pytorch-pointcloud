# SUN RGB-D detection datamodule. Transforms are model-specific and live in the
# experiment configs (configs/experiment/), which override `transform`.
_target_: torch_pointcloud.lightning.PointCloudDataModule
batch_size: 8
num_workers: 4
# Detection collation (stack dense targets, index ragged boxes) is declared on the SunRGBD dataset
# via its `stack_keys` / `index_keys` attributes, which PointCloudDataLoader reads automatically.

train_dataset:
  _target_: torch_pointcloud.datasets.SunRGBD
  root: ${paths.data_dir}
  split: train
  transform: null

val_dataset:
  _target_: torch_pointcloud.datasets.SunRGBD
  root: ${paths.data_dir}
  split: val
  transform: null
