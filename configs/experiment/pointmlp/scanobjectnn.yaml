# @package _global_
# PointMLP classification on ScanObjectNN PB_T50_RS (pre-std-fix upstream checkpoints; the README 86.1 / 84.1 are unreachable).
# Train: uv run --no-sync python train.py experiment=pointmlp/scanobjectnn
# Benchmark: uv run --no-sync python test.py experiment=pointmlp/scanobjectnn
#
# | model.name                  | accuracy |
# | --------------------------- | -------- |
# | pointmlp-base.scanobjectnn  | 0.7724   |
# | pointmlp-elite.scanobjectnn | 0.7533   |
# (exact at precision=32-true datamodule.batch_size=16)
defaults:
  - override /datamodule: scanobjectnn
  - override /model: classification
  - override /callbacks: classification

trainer:
  max_epochs: 250

model:
  name: pointmlp-base.scanobjectnn
  num_classes: 15
  pretrained: false
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    weight_decay: 0.05
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}

datamodule:
  train_dataset:
    background: true
    variant: augmentedrot_scale75
  val_dataset:
    background: true
    variant: augmentedrot_scale75
