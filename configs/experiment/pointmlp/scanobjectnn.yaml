# @package _global_
# PointMLP classification on ScanObjectNN PB_T50_RS
# Train: uv run --no-sync python train.py experiment=pointmlp/scanobjectnn
# Benchmark: uv run --no-sync python test.py experiment=pointmlp/scanobjectnn
#
# NOTE: The references need post-std-fix checkpoints whose links are dead; the shipped ones score ~0.77 upstream too.
#
# | model.name                        | accuracy | reference |
# | --------------------------------- | -------- | --------- |
# | pointmlp-base.scanobjectnn.xu-ma  | 0.7748   | 0.861     |
# | pointmlp-elite.scanobjectnn.xu-ma | 0.7672   | 0.841     |

defaults:
  - override /datamodule: scanobjectnn
  - override /model: classification
  - override /callbacks: classification

trainer:
  max_epochs: 250

model:
  name: pointmlp-base.scanobjectnn.xu-ma
  num_classes: 15
  pretrained: false
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    weight_decay: 0.05
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}

datamodule:
  eval_batch_size: 16
  train_dataset:
    background: true
    variant: augmentedrot_scale75
  val_dataset:
    background: true
    variant: augmentedrot_scale75
