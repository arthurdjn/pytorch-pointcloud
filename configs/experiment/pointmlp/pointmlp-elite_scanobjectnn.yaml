# @package _global_
# pointmlp-elite.scanobjectnn classification on ScanObjectNN. Reference: see examples/*_benchmark_scanobjectnn.py.
# Run: uv run --no-sync python train.py experiment=pointmlp/pointmlp-elite_scanobjectnn
# Benchmark pretrained: uv run --no-sync python train.py experiment=pointmlp/pointmlp-elite_scanobjectnn train=false model.pretrained=true
defaults:
  - override /data: scanobjectnn
  - override /model: classification
  - override /callbacks: classification

trainer:
  max_epochs: 250

model:
  name: pointmlp-elite.scanobjectnn

data:
  train_dataset:
    background: true
    variant: augmentedrot_scale75
  val_dataset:
    background: true
    variant: augmentedrot_scale75
