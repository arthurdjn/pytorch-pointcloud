# @package _global_
# Training experiment for `randlanet-tsunghanwu.semantickitti`. Uses the model's registered transform as a runnable baseline
# input pipeline (matches the architecture's expected features); add dataset augmentation for a
# full from-scratch run. The benchmark counterpart is randlanet_segmentation_semantickitti_benchmark.
# Run: uv run --no-sync python train.py experiment=randlanet/randlanet_semantickitti
# Benchmark pretrained: uv run --no-sync python train.py experiment=randlanet/randlanet_semantickitti train=false model.model.pretrained=true
defaults:
  - override /data: semantickitti
  - override /model: segmentation
  - override /callbacks: segmentation

trainer:
  max_epochs: 100

model:
  input_keys: [x, pos, batch]
  ignore_index: 255
  model:
    name: randlanet-tsunghanwu.semantickitti

data:
  train_dataset:
    transform:
      _target_: torch_pointcloud.models.get_model_transforms
      name: randlanet-tsunghanwu.semantickitti
      task: segmentation
  val_dataset:
    transform:
      _target_: torch_pointcloud.models.get_model_transforms
      name: randlanet-tsunghanwu.semantickitti
      task: segmentation
