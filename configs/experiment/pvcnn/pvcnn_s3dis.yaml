# @package _global_
# Training experiment for `pvcnn-mit-han-lab.s3dis-area5`. Uses the model's registered transform as a runnable baseline
# input pipeline (matches the architecture's expected features); add dataset augmentation for a
# full from-scratch run. The benchmark counterpart is pvcnn_segmentation_s3dis_benchmark.
# Run: uv run --no-sync python train.py experiment=pvcnn/pvcnn_s3dis
# Benchmark pretrained: uv run --no-sync python train.py experiment=pvcnn/pvcnn_s3dis train=false model.model.pretrained=true
defaults:
  - override /data: s3dis_hdf5
  - override /model: segmentation
  - override /callbacks: segmentation

trainer:
  max_epochs: 100
  precision: "32-true" # spconv/torchsparse fp16 tuner fails under 16-mixed

model:
  input_keys: [x, pos, batch]
  model:
    name: pvcnn-mit-han-lab.s3dis-area5

data:
  train_dataset:
    transform:
      _target_: torch_pointcloud.models.get_model_transforms
      name: pvcnn-mit-han-lab.s3dis-area5
      task: segmentation
  val_dataset:
    transform:
      _target_: torch_pointcloud.models.get_model_transforms
      name: pvcnn-mit-han-lab.s3dis-area5
      task: segmentation
