# @package _global_
# PVCNN semantic segmentation on S3DIS Area 5 (per-block HDF5 protocol).
# Train: uv run --no-sync python train.py experiment=pvcnn/s3dis
# Benchmark: uv run --no-sync python test.py experiment=pvcnn/s3dis
#
# | model.name                    | mIoU   | accuracy |
# | ----------------------------- | ------ | -------- |
# | pvcnn-mit-han-lab.s3dis-area5 | 0.3593 | 0.7654   |
defaults:
  - override /datamodule: s3dis_hdf5
  - override /model: segmentation
  - override /callbacks: segmentation

trainer:
  max_epochs: 100
  # spconv/torchsparse fp16 tuner fails under 16-mixed
  precision: "32-true"

model:
  name: pvcnn-mit-han-lab.s3dis-area5
  num_classes: 13
  pretrained: false
  input_keys: [x, pos, batch]
  target_key: segment
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.006
    weight_decay: 0.05

datamodule:
  train_dataset:
    transform: null
  val_dataset:
    transform: null
