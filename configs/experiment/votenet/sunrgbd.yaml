# @package _global_
# VoteNet 3D object detection on SUN RGB-D.
# Train: uv run --no-sync python train.py experiment=votenet/sunrgbd
# Benchmark: uv run --no-sync python test.py experiment=votenet/sunrgbd
# Measured: deferred (exceeds the 5-minute run budget)
defaults:
  - override /datamodule: sunrgbd
  - override /model: detection
  - override /callbacks: votenet

trainer:
  max_epochs: 180
  # VoteNet's set-abstraction grouping trains in fp32 (matches the reference)
  precision: "32-true"

model:
  name: votenet.sunrgbd.fair
  pretrained: false
  input_keys: [x, pos, batch]
  min_points: 5
  criterion:
    _target_: torch_pointcloud.losses.VoteNetLoss
    _partial_: true
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.001
    weight_decay: 0.0
  scheduler:
    _target_: torch.optim.lr_scheduler.MultiStepLR
    _partial_: true
    milestones: [80, 120, 160]
    gamma: 0.1

datamodule:
  # Dense VoteNet targets stack to (B, M, ...); the ragged GT boxes stay packed (emits batch_box).
  stack_keys: [center_label, heading_class_label, heading_residual_label, size_class_label, size_residual_label, sem_cls_label, box_label_mask, vote_label, vote_label_mask]
  cat_keys: [box]

  train_dataset:
    transform:
      _target_: torch_pointcloud.transforms.Compose
      transforms:
        - _target_: torch_pointcloud.transforms.AxisMinOffset
          keys: pos
          axis: 2
          quantile: 0.0099
          dst_keys: height
        - _target_: torch_pointcloud.transforms.RandomSample
          keys: [pos, height]
          num_samples: 20000
        - _target_: torch_pointcloud.transforms.GenerateVoteLabels
          pos_key: pos
          box_key: box
        - _target_: torch_pointcloud.transforms.RandomFlip
          keys: [pos, vote_label]
          box_key: box
          axes: [0]
        - _target_: torch_pointcloud.transforms.RandomRotate
          keys: [pos, vote_label]
          box_key: box
          angle_range: [-30.0, 30.0]
        - _target_: torch_pointcloud.transforms.RandomScale
          keys: [pos, vote_label]
          box_key: box
          scale_range: [0.85, 1.15]
        - _target_: torch_pointcloud.transforms.EncodeVoteNetTargets
          box_key: box
          num_heading_bin: 12
          max_num_obj: 64
          mean_sizes:
            - [2.114256, 1.620300, 0.927272]
            - [0.791118, 1.279516, 0.718182]
            - [0.923508, 1.867419, 0.845495]
            - [0.591958, 0.552978, 0.827272]
            - [0.699104, 0.454178, 0.756250]
            - [0.695190, 1.346299, 0.736364]
            - [0.528526, 1.002642, 1.172878]
            - [0.500618, 0.632163, 0.683424]
            - [0.404671, 1.071108, 1.688889]
            - [0.765840, 1.398258, 0.472728]
        - _target_: torch_pointcloud.transforms.Cat
          keys: [height]
          dst_key: x
          dim: 1

  val_dataset:
    transform:
      _target_: torch_pointcloud.transforms.Compose
      transforms:
        - _target_: torch_pointcloud.transforms.AxisMinOffset
          keys: pos
          axis: 2
          quantile: 0.0099
          dst_keys: height
        - _target_: torch_pointcloud.transforms.RandomSample
          keys: [pos, height]
          num_samples: 20000
        - _target_: torch_pointcloud.transforms.GenerateVoteLabels
          pos_key: pos
          box_key: box
        - _target_: torch_pointcloud.transforms.EncodeVoteNetTargets
          box_key: box
          num_heading_bin: 12
          max_num_obj: 64
          mean_sizes:
            - [2.114256, 1.620300, 0.927272]
            - [0.791118, 1.279516, 0.718182]
            - [0.923508, 1.867419, 0.845495]
            - [0.591958, 0.552978, 0.827272]
            - [0.699104, 0.454178, 0.756250]
            - [0.695190, 1.346299, 0.736364]
            - [0.528526, 1.002642, 1.172878]
            - [0.500618, 0.632163, 0.683424]
            - [0.404671, 1.071108, 1.688889]
            - [0.765840, 1.398258, 0.472728]
        - _target_: torch_pointcloud.transforms.Cat
          keys: [height]
          dst_key: x
          dim: 1
