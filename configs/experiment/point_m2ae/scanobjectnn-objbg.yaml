# @package _global_
# Point-M2AE classification on ScanObjectNN OBJ_BG (with background).
# Benchmark: uv run --no-sync python test.py experiment=point_m2ae/scanobjectnn-objbg
#
# | model.name                         | accuracy |
# | ---------------------------------- | -------- |
# | point-m2ae-base.scanobjectnn-objbg.renrui-zhang | 0.9122   |
defaults:
  - override /datamodule: scanobjectnn
  - override /model: classification
  - override /callbacks: classification

model:
  name: point-m2ae-base.scanobjectnn-objbg.renrui-zhang
  num_classes: 15
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss

datamodule:
  train_dataset:
    background: true
    variant: null
  val_dataset:
    background: true
    variant: null
