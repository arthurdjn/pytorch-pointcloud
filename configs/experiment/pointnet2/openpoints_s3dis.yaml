# @package _global_
# PointNet++ (OpenPoints) semantic segmentation on S3DIS Area 5.
# Train: uv run --no-sync python train.py experiment=pointnet2/openpoints_s3dis
# Benchmark: uv run --no-sync python test.py experiment=pointnet2/openpoints_s3dis
#
# | model.name                       | reference (mIoU / OA) |
# | -------------------------------- | --------------------- |
# | pointnet2.s3dis-area5.openpoints | 0.636 / 0.883         |

defaults:
  - override /datamodule: s3dis
  - override /model: segmentation
  - override /callbacks: segmentation
  - override /inferer: voxel_partition

trainer:
  max_epochs: 100

model:
  name: pointnet2.s3dis-area5.openpoints
  num_classes: 13
  pretrained: false
  input_keys: [x, pos, batch]
  target_key: segment
  inferer:
    voxel_size: 0.04
    sub_batch_size: 1
    softmax: false
    reduce: mean
    # The head is already permuted to the S3DIS class order, so no relabel.
    transform:
      _target_: torch_pointcloud.transforms.Compose
      transforms:
        - _target_: torch_pointcloud.transforms.Slice
          keys: pos
          start: 2
          stop: 3
          dim: 1
          dst_keys: height
        - _target_: torch_pointcloud.transforms.Shift
          keys: height
          method: min
        - _target_: torch_pointcloud.transforms.Divide
          keys: color
          divisor: 255.0
        - _target_: torch_pointcloud.transforms.Normalize
          keys: color
          mean: [0.5136457, 0.49523646, 0.44921124]
          std: [0.18308958, 0.18415008, 0.19252081]
        - _target_: torch_pointcloud.transforms.Shift
          keys: pos
          method: centroid
          axes: [0, 1]
        - _target_: torch_pointcloud.transforms.Shift
          keys: pos
          method: min
          axes: [2]
        - _target_: torch_pointcloud.transforms.Cat
          keys: [color, height]
          dst_key: x
  criterion:
    _target_: torch.nn.CrossEntropyLoss
    ignore_index: -1
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.006
    weight_decay: 0.05

datamodule:
  eval_batch_size: 1
  train_dataset:
    transform: null
  val_dataset:
    transform:
      _target_: torch_pointcloud.transforms.Compose
      transforms:
        - _target_: torch_pointcloud.transforms.Voxelize
          pos_key: pos
          pos_reduce: first
          size: 0.04
          method: fnv
          keys: [color, segment]
          reduce: [first, first]
          random_sample: true
        - _target_: torch_pointcloud.transforms.Slice
          keys: pos
          start: 2
          stop: 3
          dim: 1
          dst_keys: height
        - _target_: torch_pointcloud.transforms.Shift
          keys: height
          method: min
        - _target_: torch_pointcloud.transforms.Divide
          keys: color
          divisor: 255.0
        - _target_: torch_pointcloud.transforms.Normalize
          keys: color
          mean: [0.5136457, 0.49523646, 0.44921124]
          std: [0.18308958, 0.18415008, 0.19252081]
        - _target_: torch_pointcloud.transforms.Shift
          keys: pos
          method: centroid
          axes: [0, 1]
        - _target_: torch_pointcloud.transforms.Shift
          keys: pos
          method: min
          axes: [2]
        - _target_: torch_pointcloud.transforms.Cat
          keys: [color, height]
          dst_key: x
  test_dataset:
    _target_: torch_pointcloud.datasets.S3DIS
    root: ${paths.data_dir}
    areas: [Area_5]
    transform:
      _target_: torch_pointcloud.transforms.Compose
      transforms:
        - _target_: torch_pointcloud.transforms.Shift
          keys: pos
          method: min
