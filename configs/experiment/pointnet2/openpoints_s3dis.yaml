# @package _global_
# PointNet++ (OpenPoints) semantic segmentation on S3DIS Area 5 (presample protocol).
# Train: uv run --no-sync python train.py experiment=pointnet2/openpoints_s3dis
# Benchmark: uv run --no-sync python test.py experiment=pointnet2/openpoints_s3dis
#
# | model.name                       | mIoU   | accuracy |
# | -------------------------------- | ------ | -------- |
# | pointnet2.s3dis-area5.openpoints | 0.6247 | 0.8717   |
defaults:
  - override /datamodule: s3dis
  - override /model: segmentation
  - override /callbacks: segmentation

trainer:
  max_epochs: 100

model:
  name: pointnet2.s3dis-area5.openpoints
  num_classes: 13
  pretrained: false
  input_keys: [x, pos, batch]
  target_key: segment
  criterion:
    _target_: torch.nn.CrossEntropyLoss
    ignore_index: -1
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.006
    weight_decay: 0.05

datamodule:
  # Evaluation runs one whole room per batch (the presample protocol).
  eval_batch_size: 1
  train_dataset:
    transform: null
  val_dataset:
    # One random voxel sample per full-resolution room; the script seeds per room, this pipeline is unseeded.
    transform:
      _target_: torch_pointcloud.transforms.Compose
      transforms:
        - _target_: torch_pointcloud.transforms.Voxelize
          pos_key: pos
          pos_reduce: first
          size: 0.04
          method: fnv
          keys: [color, segment]
          reduce: [first, first]
          random_sample: true
        - _target_: torch_pointcloud.transforms.Slice
          keys: pos
          start: 2
          stop: 3
          dim: 1
          dst_keys: height
        - _target_: torch_pointcloud.transforms.Shift
          keys: height
          method: min
        - _target_: torch_pointcloud.transforms.Divide
          keys: color
          divisor: 255.0
        - _target_: torch_pointcloud.transforms.Normalize
          keys: color
          mean: [0.5136457, 0.49523646, 0.44921124]
          std: [0.18308958, 0.18415008, 0.19252081]
        - _target_: torch_pointcloud.transforms.Shift
          keys: pos
          method: centroid
          axes: [0, 1]
        - _target_: torch_pointcloud.transforms.Shift
          keys: pos
          method: min
          axes: [2]
        - _target_: torch_pointcloud.transforms.Cat
          keys: [color, height]
          dst_key: x
