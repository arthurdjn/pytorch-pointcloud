# @package _global_
# PointNet++ (OpenPoints) classification on modelnet40.
# Benchmark: uv run --no-sync python train.py experiment=pointnet2/pointnet2-openpoints_modelnet40 train=false model.model.pretrained=true
defaults:
  - override /data: modelnet40
  - override /model: classification
  - override /callbacks: classification

trainer:
  max_epochs: 250

model:
  model:
    name: pointnet2-openpoints.modelnet40
