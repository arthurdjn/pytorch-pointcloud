# @package _global_
# PointNet++ (OpenPoints) classification on modelnet40.
# Benchmark: uv run --no-sync python train.py experiment=pointnet2/pointnet2-openpoints_modelnet40 train=false model.pretrained=true
defaults:
  - override /data: modelnet40_normal_resampled
  - override /model: classification
  - override /callbacks: classification

trainer:
  max_epochs: 250

model:
  name: pointnet2-openpoints.modelnet40
  pretrained: false
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    weight_decay: 0.05
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}
