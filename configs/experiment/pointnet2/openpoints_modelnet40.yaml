# @package _global_
# PointNet++ (OpenPoints) classification on ModelNet40 (normal-resampled).
# Train: uv run --no-sync python train.py experiment=pointnet2/openpoints_modelnet40
# Benchmark: uv run --no-sync python test.py experiment=pointnet2/openpoints_modelnet40
#
# | model.name                      | accuracy | reference |
# | ------------------------------- | -------- | --------- |
# | pointnet2.modelnet40.openpoints | 0.9190   | 0.930     |

defaults:
  - override /datamodule: modelnet40_normal_resampled
  - override /model: classification
  - override /callbacks: classification

trainer:
  max_epochs: 250

model:
  name: pointnet2.modelnet40.openpoints
  num_classes: 40
  pretrained: false
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    weight_decay: 0.05
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}
