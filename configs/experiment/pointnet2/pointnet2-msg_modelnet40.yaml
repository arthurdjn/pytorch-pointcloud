# @package _global_
# pointnet2-yanx27-msg.modelnet40 classification on ModelNet40 (normal-resampled). Reference: 92.67% OA / 90.60% mAcc.
# Run: uv run --no-sync python train.py experiment=pointnet2/pointnet2-msg_modelnet40
# Benchmark pretrained: uv run --no-sync python train.py experiment=pointnet2/pointnet2-msg_modelnet40 train=false model.pretrained=true
defaults:
  - override /data: modelnet40_normal_resampled
  - override /model: classification
  - override /callbacks: classification

trainer:
  max_epochs: 200

model:
  name: pointnet2-yanx27-msg.modelnet40
  num_classes: 40
  pretrained: false
  input_keys: [normal, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    weight_decay: 0.05
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}

data:
  train_dataset:
    transform:
      _target_: torch_pointcloud.transforms.Compose
      transforms:
        - _target_: torch_pointcloud.transforms.FarthestPointSample
          pos_key: pos
          keys: pos
          num_samples: 1024
        - _target_: torch_pointcloud.transforms.Rescale
          keys: pos
          method: centroid
        - _target_: torch_pointcloud.transforms.RandomScale
          keys: pos
          scale_range: [0.8, 1.25]
        - _target_: torch_pointcloud.transforms.RandomJitter
          keys: pos
          sigma: 0.01
          clip: 0.05
