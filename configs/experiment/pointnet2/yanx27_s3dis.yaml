# @package _global_
# PointNet++ (yanx27) semantic segmentation on S3DIS Area 5.
# Train: uv run --no-sync python train.py experiment=pointnet2/yanx27_s3dis
# Benchmark: uv run --no-sync python test.py experiment=pointnet2/yanx27_s3dis
#
# | model.name                   | reference (mIoU / OA) |
# | ---------------------------- | --------------------- |
# | pointnet2.s3dis-area5.xu-yan | 0.535 / 0.830         |

defaults:
  - override /datamodule: s3dis_hdf5
  - override /model: segmentation
  - override /callbacks: segmentation
  - override /inferer: tta

trainer:
  max_epochs: 100

model:
  name: pointnet2.s3dis-area5.xu-yan
  num_classes: 13
  pretrained: false
  input_keys: [x, pos, batch]
  target_key: segment
  scheduler_interval: step
  inferer:
    # Three identity passes: each pass re-draws the block padding and the chunk permutation.
    num_passes: 3
    aggregate: mean
    transforms:
      _target_: torch_pointcloud.transforms.Compose
      transforms: []
    base:
      _target_: torch_pointcloud.inferers.SlidingWindowInferer
      block_size: 1.0
      overlap: 0.5
      dims: [0, 1]
      padding: 0.001
      roi_num_points: 4096
      softmax: true
      aggregate: vote
      inverse_key: inverse
      transform:
        _target_: torch_pointcloud.transforms.Compose
        transforms:
          - _target_: torch_pointcloud.transforms.BBoxCenter
            keys: block_bbox
            dst_keys: block_center
          - _target_: torch_pointcloud.transforms.CopyItems
            keys: pos
            names: norm_pos
          - _target_: torch_pointcloud.transforms.DivideKey
            keys: norm_pos
            div_keys: coord_max
          - _target_: torch_pointcloud.transforms.SubtractKey
            keys: pos
            sub_keys: block_center
            axes: [0, 1]
          - _target_: torch_pointcloud.transforms.ToFloat
            keys: color
          - _target_: torch_pointcloud.transforms.Divide
            keys: color
            divisor: 255.0
          - _target_: torch_pointcloud.transforms.Cat
            keys: [pos, color, norm_pos]
            dst_key: x
            dim: 1
          - _target_: torch_pointcloud.transforms.DivisiblePad
            num_samples: 4096
            pad_fill: random
            dst_inverse_key: inverse
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.001
  scheduler:
    _target_: torch.optim.lr_scheduler.OneCycleLR
    _partial_: true
    max_lr: 0.001
    # S3DIS HDF5 train (16733 blocks, Areas 1-4 + 6) at batch_size 32 over 100 epochs
    total_steps: 52300
    pct_start: 0.05
    anneal_strategy: cos
    div_factor: 10.0
    final_div_factor: 1000.0

datamodule:
  batch_size: 32
  # One whole room per eval batch: `coord_max` is a per-room (3,) tensor.
  eval_batch_size: 1
  train_dataset:
    transform: null
  val_dataset:
    transform: null
  test_dataset:
    _target_: torch_pointcloud.datasets.S3DIS
    root: ${paths.data_dir}
    areas: [Area_5]
    aligned: false
    transform:
      _target_: torch_pointcloud.transforms.Compose
      transforms:
        - _target_: torch_pointcloud.transforms.Shift
          keys: pos
          method: min
        - _target_: torch_pointcloud.transforms.Reduce
          keys: pos
          op: max
          dst_keys: coord_max
