# @package _global_
# point-mamba-base.scanobjectnn classification on ScanObjectNN. Reference: see examples/*_benchmark_scanobjectnn.py.
# Run: uv run --no-sync python train.py experiment=point_mamba/point_mamba_scanobjectnn
# Benchmark pretrained: uv run --no-sync python train.py experiment=point_mamba/point_mamba_scanobjectnn train=false model.pretrained=true
defaults:
  - override /data: scanobjectnn
  - override /model: classification
  - override /callbacks: classification

trainer:
  max_epochs: 250

model:
  name: point-mamba-base.scanobjectnn

data:
  train_dataset:
    background: true
    variant: null
  val_dataset:
    background: true
    variant: null
