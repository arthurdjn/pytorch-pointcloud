# @package _global_
# PointMamba classification on ScanObjectNN OBJ_ONLY
# Train: uv run --no-sync python train.py experiment=point_mamba/scanobjectnn-nobg
# Benchmark: uv run --no-sync python test.py experiment=point_mamba/scanobjectnn-nobg
#
# NOTE: Could not reproduce the reference score of 0.9260 even from the released checkpoint / code.
#
# | model.name                                        | accuracy | reference |
# | ------------------------------------------------- | -------- | --------- |
# | point-mamba-base.scanobjectnn-nobg.dingkang-liang | 0.8382   | 0.9260    |

defaults:
  - override /datamodule: scanobjectnn
  - override /model: classification
  - override /callbacks: classification

trainer:
  max_epochs: 250

model:
  name: point-mamba-base.scanobjectnn-nobg.dingkang-liang
  num_classes: 15
  pretrained: false
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    weight_decay: 0.05
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}

datamodule:
  eval_batch_size: 16
  train_dataset:
    background: false
    variant: null
  val_dataset:
    background: false
    variant: null
