# @package _global_
# PointMamba classification on ScanObjectNN OBJ_ONLY (old-arch upstream checkpoint; the reference code also scores 0.833).
# Train: uv run --no-sync python train.py experiment=point_mamba/scanobjectnn-nobg
# Benchmark: uv run --no-sync python test.py experiment=point_mamba/scanobjectnn-nobg
#
# | model.name                         | accuracy |
# | ---------------------------------- | -------- |
# | point-mamba-base.scanobjectnn-nobg | 0.8382   |
# (exact at precision=32-true datamodule.batch_size=16)
defaults:
  - override /datamodule: scanobjectnn
  - override /model: classification
  - override /callbacks: classification

trainer:
  max_epochs: 250

model:
  name: point-mamba-base.scanobjectnn-nobg
  num_classes: 15
  pretrained: false
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    weight_decay: 0.05
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}

datamodule:
  train_dataset:
    background: false
    variant: null
  val_dataset:
    background: false
    variant: null
