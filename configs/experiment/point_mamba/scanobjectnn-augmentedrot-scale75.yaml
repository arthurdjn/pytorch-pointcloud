# @package _global_
# PointMamba classification on ScanObjectNN PB_T50_RS (hardest).
# Train: uv run --no-sync python train.py experiment=point_mamba/scanobjectnn-augmentedrot-scale75
# Benchmark: uv run --no-sync python test.py experiment=point_mamba/scanobjectnn-augmentedrot-scale75
#
# | model.name                                         | accuracy |
# | --------------------------------------------------- | -------- |
# | point-mamba-base.scanobjectnn-augmentedrot-scale75 | 0.8935   |
defaults:
  - override /datamodule: scanobjectnn
  - override /model: classification
  - override /callbacks: classification

trainer:
  max_epochs: 250

model:
  name: point-mamba-base.scanobjectnn-augmentedrot-scale75
  num_classes: 15
  pretrained: false
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    weight_decay: 0.05
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}

datamodule:
  train_dataset:
    background: true
    variant: augmentedrot_scale75
  val_dataset:
    background: true
    variant: augmentedrot_scale75
