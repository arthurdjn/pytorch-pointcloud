# @package _global_
# point-mamba-base.scanobjectnn-nobg classification on ScanObjectNN. Reference: see examples/*_benchmark_scanobjectnn.py.
# Run: uv run --no-sync python train.py experiment=point_mamba/point_mamba-nobg_scanobjectnn
# Benchmark pretrained: uv run --no-sync python train.py experiment=point_mamba/point_mamba-nobg_scanobjectnn train=false model.model.pretrained=true
defaults:
  - override /data: scanobjectnn
  - override /model: classification
  - override /callbacks: classification

trainer:
  max_epochs: 250

model:
  model:
    name: point-mamba-base.scanobjectnn-nobg

data:
  train_dataset:
    background: false
    variant: null
  val_dataset:
    background: false
    variant: null
