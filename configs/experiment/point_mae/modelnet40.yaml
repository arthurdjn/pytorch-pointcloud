# @package _global_
# Point-MAE classification on ModelNet40 (normal-resampled), single pass (no voting).
# Benchmark: uv run --no-sync python test.py experiment=point_mae/modelnet40
#
# | model.name                               | accuracy | reference |
# | ---------------------------------------- | -------- | --------- |
# | point-mae-base.modelnet40.yatian-pang    | 0.9287   | 0.9319    |
# | point-mae-base.modelnet40-8k.yatian-pang | 0.9335   | 0.9404    |

defaults:
  - override /datamodule: modelnet40_normal_resampled
  - override /model: classification
  - override /callbacks: classification

model:
  name: point-mae-base.modelnet40.yatian-pang
  num_classes: 40
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss
