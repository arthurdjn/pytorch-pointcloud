# @package _global_
# Point-MAE classification on ScanObjectNN OBJ_ONLY (no background).
# Benchmark: uv run --no-sync python test.py experiment=point_mae/scanobjectnn-objonly
#
# | model.name                          | accuracy |
# | ----------------------------------- | -------- |
# | point-mae-base.scanobjectnn-objonly | 0.8830   |
defaults:
  - override /datamodule: scanobjectnn
  - override /model: classification
  - override /callbacks: classification

model:
  name: point-mae-base.scanobjectnn-objonly
  num_classes: 15
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss

datamodule:
  train_dataset:
    background: false
    variant: null
  val_dataset:
    background: false
    variant: null
