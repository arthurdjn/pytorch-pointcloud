# @package _global_
# DGCNN part segmentation on ShapeNetPart.
# Train: uv run --no-sync python train.py experiment=dgcnn/shapenetpart
# Benchmark: uv run --no-sync python test.py experiment=dgcnn/shapenetpart
#
# | model.name               | ins_mIoU | cls_mIoU |
# | ------------------------ | -------- | -------- |
# | dgcnn.shapenetpart.an-tao | 0.8522   | 0.8092   |
defaults:
  - override /datamodule: shapenetpart
  - override /model: segmentation
  - override /callbacks: part_segmentation

trainer:
  max_epochs: 100

model:
  name: dgcnn.shapenetpart.an-tao
  pretrained: false
  num_classes: 50
  input_keys: [x, pos, batch, category]
  target_key: segment
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.006
    weight_decay: 0.05
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: 100

datamodule:
  train_dataset:
    transform:
      _target_: torch_pointcloud.transforms.Compose
      transforms:
        - _target_: torch_pointcloud.transforms.Rescale
          keys: pos
        # Fix every cloud to 2048 points: uniform batch shapes (stable cuDNN kernels).
        - _target_: torch_pointcloud.transforms.RandomSample
          keys: [pos, normal, segment]
          num_samples: 2048
          replace: true
        # DGCNN part-seg conditions on a (B, 16) one-hot category; the dataset provides a scalar index.
        - _target_: torch_pointcloud.transforms.ToTensor
          keys: category
        - _target_: torch_pointcloud.transforms.OneHot
          keys: category
          num_classes: 16

  val_dataset:
    transform:
      _target_: torch_pointcloud.transforms.Compose
      transforms:
        - _target_: torch_pointcloud.transforms.Rescale
          keys: pos
        - _target_: torch_pointcloud.transforms.FarthestPointSample
          pos_key: pos
          keys: [normal, segment]
          num_samples: 2048
        - _target_: torch_pointcloud.transforms.ToTensor
          keys: category
        - _target_: torch_pointcloud.transforms.OneHot
          keys: category
          num_classes: 16
