# @package _global_
# DGCNN classification on ModelNet40 (normal-resampled, 2048 points).
# Train: uv run --no-sync python train.py experiment=dgcnn/modelnet40-2048
# Benchmark: uv run --no-sync python test.py experiment=dgcnn/modelnet40-2048
#
# | model.name                   | accuracy | reference |
# | ---------------------------- | -------- | --------- |
# | dgcnn.modelnet40-2048.an-tao | 0.9246   | 0.936     |

defaults:
  - override /datamodule: modelnet40_normal_resampled
  - override /model: classification
  - override /callbacks: classification

trainer:
  max_epochs: 200

model:
  name: dgcnn.modelnet40-2048.an-tao
  num_classes: 40
  pretrained: false
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    weight_decay: 0.05
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}

datamodule:
  train_dataset:
    transform:
      _target_: torch_pointcloud.transforms.Compose
      transforms:
        - _target_: torch_pointcloud.transforms.FarthestPointSample
          pos_key: pos
          keys: pos
          num_samples: 2048
        - _target_: torch_pointcloud.transforms.Rescale
          keys: pos
          method: centroid
        - _target_: torch_pointcloud.transforms.RandomScale
          keys: pos
          scale_range: [0.8, 1.25]
        - _target_: torch_pointcloud.transforms.RandomJitter
          keys: pos
          sigma: 0.01
          clip: 0.05
