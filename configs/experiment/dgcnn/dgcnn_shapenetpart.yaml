# @package _global_
# DGCNN part segmentation on ShapeNetPart.
# Run: uv run --no-sync python train.py experiment=dgcnn/dgcnn_shapenetpart
# Benchmark pretrained: uv run --no-sync python train.py experiment=dgcnn/dgcnn_shapenetpart train=false model.pretrained=true
defaults:
  - override /data: shapenetpart
  - override /model: segmentation
  - override /callbacks: segmentation

trainer:
  max_epochs: 100

model:
  name: dgcnn-antao.shapenetpart
  input_keys: [x, pos, batch, category]
  target_key: segment
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.006
    weight_decay: 0.05
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: 100

data:
  train_dataset:
    transform:
      _target_: torch_pointcloud.transforms.Compose
      transforms:
        - _target_: torch_pointcloud.transforms.Rescale
          keys: pos
        # Fix every cloud to 2048 points: uniform batch shapes (stable cuDNN kernels).
        - _target_: torch_pointcloud.transforms.RandomSample
          keys: [pos, normal, segment]
          num_samples: 2048
          replace: true
        # DGCNN part-seg conditions on a (B, 16) one-hot category; the dataset
        # provides a scalar index, so tensor-ify then one-hot it.
        - _target_: torch_pointcloud.transforms.ToTensor
          keys: category
        - _target_: torch_pointcloud.transforms.OneHot
          keys: category
          num_classes: 16

  val_dataset:
    transform:
      _target_: torch_pointcloud.transforms.Compose
      transforms:
        - _target_: torch_pointcloud.transforms.Rescale
          keys: pos
        # Fix every cloud to 2048 points: uniform batch shapes (stable cuDNN kernels).
        - _target_: torch_pointcloud.transforms.RandomSample
          keys: [pos, normal, segment]
          num_samples: 2048
          replace: true
        - _target_: torch_pointcloud.transforms.ToTensor
          keys: category
        - _target_: torch_pointcloud.transforms.OneHot
          keys: category
          num_classes: 16
