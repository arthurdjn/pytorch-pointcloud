# @package _global_
# PointNeXt classification on ScanObjectNN PB_T50_RS (hardest).
# Train: uv run --no-sync python train.py experiment=pointnext/scanobjectnn
# Benchmark: uv run --no-sync python test.py experiment=pointnext/scanobjectnn
#
# | model.name                           | accuracy | reference |
# | ------------------------------------ | -------- | --------- |
# | pointnext-sm.scanobjectnn.openpoints | 0.8817   | 0.8820    |

defaults:
  - override /datamodule: scanobjectnn
  - override /model: classification
  - override /callbacks: classification

trainer:
  max_epochs: 250

model:
  name: pointnext-sm.scanobjectnn.openpoints
  num_classes: 15
  pretrained: false
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    weight_decay: 0.05
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}

datamodule:
  eval_batch_size: 16
  train_dataset:
    background: true
    variant: augmentedrot_scale75
    transform: null
  val_dataset:
    background: true
    variant: augmentedrot_scale75
