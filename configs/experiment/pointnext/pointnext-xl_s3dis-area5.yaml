# @package _global_
# Training experiment for `pointnext-xl.s3dis-area5` (registered transform as a runnable baseline pipeline).
# Run: uv run --no-sync python train.py experiment=pointnext/pointnext-xl_s3dis-area5
# Benchmark pretrained: uv run --no-sync python train.py experiment=pointnext/pointnext-xl_s3dis-area5 train=false model.pretrained=true
defaults:
  - override /data: s3dis
  - override /model: segmentation
  - override /callbacks: segmentation

trainer:
  max_epochs: 100

model:
  name: pointnext-xl.s3dis-area5
  pretrained: false
  input_keys: [x, pos, batch]
  target_key: segment
  criterion:
    _target_: torch.nn.CrossEntropyLoss
    ignore_index: -1
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.006
    weight_decay: 0.05

data:
  train_dataset:
    transform: null
  val_dataset:
    transform: null
