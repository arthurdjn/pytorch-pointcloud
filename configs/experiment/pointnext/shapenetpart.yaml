# @package _global_
# PointNeXt part segmentation on ShapeNetPart, single pass (no voting; the model zoo evals vote 10x + kNN refine).
# Benchmark: uv run --no-sync python test.py experiment=pointnext/shapenetpart
#
# | model.name                     | ins_mIoU | cls_mIoU |
# | ------------------------------ | -------- | -------- |
# | pointnext-sm.shapenetpart      | 0.8587   | 0.8348   |
# | pointnext-sm-c64.shapenetpart  | -        | -        |
# | pointnext-sm-c160.shapenetpart | -        | -        |
# Measured: deferred (c64 / c160 not re-measured under the ins_mIoU / cls_mIoU metric)
defaults:
  - override /datamodule: shapenetpart
  - override /model: segmentation
  - override /callbacks: part_segmentation

model:
  name: pointnext-sm.shapenetpart
  num_classes: 50
  input_keys: [x, pos, batch, cls_onehot]
  target_key: segment
  criterion:
    _target_: torch.nn.CrossEntropyLoss
