# @package _global_
# PointNeXt part segmentation on ShapeNetPart.
# Benchmark: uv run --no-sync python test.py experiment=pointnext/shapenetpart
#
# | model.name                                | ins_mIoU | cls_mIoU | reference     |
# | ----------------------------------------- | -------- | -------- | ------------- |
# | pointnext-sm.shapenetpart.openpoints      | 0.8690   | 0.8449   | 0.867 / 0.842 |
# | pointnext-sm-c64.shapenetpart.openpoints  | 0.8693   | 0.8530   | 0.869 / 0.852 |
# | pointnext-sm-c160.shapenetpart.openpoints | 0.8715   | 0.8524   | 0.871 / 0.854 |

defaults:
  - override /datamodule: shapenetpart
  - override /model: segmentation
  - override /callbacks: part_segmentation

model:
  name: pointnext-sm.shapenetpart.openpoints
  num_classes: 50
  input_keys: [x, pos, batch, category]
  target_key: segment
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  inferer:
    _target_: torch_pointcloud.inferers.PartRefinementInferer
    min_count: 10
    num_neighbors: 11
    base:
      _target_: torch_pointcloud.inferers.TTAInferer
      base:
        _target_: torch_pointcloud.inferers.SimpleInferer
      num_passes: 10
      include_identity: true
      aggregate: mean
      transforms:
        _target_: torch_pointcloud.transforms.RandomScale
        keys: pos
        scale_range: [0.8, 1.2]
        anisotropic: true
        p: 1.0
