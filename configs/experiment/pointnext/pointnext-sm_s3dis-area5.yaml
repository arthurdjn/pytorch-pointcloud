# @package _global_
# Training experiment for `pointnext-sm.s3dis-area5` (registered transform as a runnable baseline pipeline).
# Run: uv run --no-sync python train.py experiment=pointnext/pointnext-sm_s3dis-area5
# Benchmark pretrained: uv run --no-sync python train.py experiment=pointnext/pointnext-sm_s3dis-area5 train=false model.model.pretrained=true
defaults:
  - override /data: s3dis
  - override /model: segmentation
  - override /callbacks: segmentation

trainer:
  max_epochs: 100

model:
  input_keys: [x, pos, batch]
  ignore_index: -1
  model:
    name: pointnext-sm.s3dis-area5

data:
  train_dataset:
    transform:
      _target_: torch_pointcloud.models.get_model_transforms
      name: pointnext-sm.s3dis-area5
      task: segmentation
  val_dataset:
    transform:
      _target_: torch_pointcloud.models.get_model_transforms
      name: pointnext-sm.s3dis-area5
      task: segmentation
