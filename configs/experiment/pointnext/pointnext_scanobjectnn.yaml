# @package _global_
# pointnext-sm.scanobjectnn classification on ScanObjectNN. Reference: see examples/*_benchmark_scanobjectnn.py.
# Run: uv run --no-sync python train.py experiment=pointnext/pointnext_scanobjectnn
# Benchmark pretrained: uv run --no-sync python train.py experiment=pointnext/pointnext_scanobjectnn train=false model.model.pretrained=true
defaults:
  - override /data: scanobjectnn
  - override /model: classification
  - override /callbacks: classification

trainer:
  max_epochs: 250

model:
  model:
    name: pointnext-sm.scanobjectnn

data:
  train_dataset:
    background: true
    variant: augmentedrot_scale75
    # The model builds `x = cat(pos, height)`; without this the raw cloud has no height channel.
    transform:
      _target_: torch_pointcloud.models.get_model_transforms
      name: ${model.model.name}
      task: ${model.model.task}
  val_dataset:
    background: true
    variant: augmentedrot_scale75
