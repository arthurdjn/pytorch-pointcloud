# @package _global_
# KPFCNN semantic segmentation on S3DIS Area 5.
# Train: uv run --no-sync python train.py experiment=kpfcnn/s3dis
# Benchmark: uv run --no-sync python test.py experiment=kpfcnn/s3dis
#
# | model.name                                | radius | reference (mIoU) |
# | ----------------------------------------- | ------ | ---------------- |
# | kpfcnn-base.s3dis.hugues-thomas           | 1.8    | 0.664            |
# | kpfcnn-base-sm.s3dis.hugues-thomas        | 1.2    | 0.654            |
# | kpfcnn-base-deform.s3dis.hugues-thomas    | 1.5    | 0.673            |
# | kpfcnn-base-sm-deform.s3dis.hugues-thomas | 1.2    | 0.667            |

defaults:
  - override /datamodule: s3dis
  - override /model: segmentation
  - override /callbacks: segmentation
  - override /inferer: potential_sphere

trainer:
  max_epochs: 100

model:
  name: kpfcnn-base.s3dis.hugues-thomas
  num_classes: 13
  pretrained: false
  input_keys: [x, pos, batch]
  target_key: label
  inverse_key: inverse
  origin_target_key: origin_segment
  inferer:
    radius: 1.8
    num_votes: 10.0
    inner_ratio: 0.7
    ema_smoothing: 0.95
    sw_batch_size: 1
    transform:
      _target_: torch_pointcloud.transforms.Compose
      transforms:
        - _target_: torch_pointcloud.transforms.RandomRotate
          keys: pos
          angle_range: [-180.0, 180.0]
          axis: 2
          p: 1.0
        - _target_: torch_pointcloud.transforms.RandomScale
          keys: pos
          scale_range: [0.9, 1.1]
          anisotropic: true
          p: 1.0
        - _target_: torch_pointcloud.transforms.RandomFlip
          keys: pos
          axes: [0]
          p: 0.5
        - _target_: torch_pointcloud.transforms.RandomJitter
          keys: pos
          sigma: 0.001
          clip: 0.005
  criterion:
    _target_: torch.nn.CrossEntropyLoss
    ignore_index: -1
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.006
    weight_decay: 0.05

datamodule:
  # Evaluation runs full-resolution rooms (no crop); more than one per batch exhausts a 24 GB GPU.
  eval_batch_size: 1
  # Multi-scene batches need the per-scene `batch_inverse` index to offset the voxel-to-raw maps.
  cat_keys: [inverse]
  train_dataset:
    transform: null
  val_dataset:
    transform:
      _target_: torch_pointcloud.transforms.Compose
      transforms:
        - _target_: torch_pointcloud.transforms.CopyItems
          keys: segment
          names: origin_segment
        - _target_: torch_pointcloud.transforms.Voxelize
          pos_key: pos
          pos_reduce: mean
          size: 0.03
          method: pyg
          keys: [color, segment]
          reduce: [mean, first]
          dst_inverse_key: inverse
        - _target_: torch_pointcloud.transforms.Divide
          keys: color
          divisor: 255.0
        - _target_: torch_pointcloud.transforms.AxisMinOffset
          keys: pos
          axis: 2
          dst_keys: height
        - _target_: torch_pointcloud.transforms.OnesLike
          keys: height
          dst_keys: ones
        - _target_: torch_pointcloud.transforms.Cat
          keys: [ones, color, height]
          dst_key: x
          dim: 1
        - _target_: torch_pointcloud.transforms.RenameItems
          keys: segment
          names: label
        - _target_: torch_pointcloud.transforms.KeepItems
          keys: [x, pos, label, origin_segment, inverse]
