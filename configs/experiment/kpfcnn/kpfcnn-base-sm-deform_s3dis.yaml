# @package _global_
# Training experiment for `kpfcnn-base-sm-deform.s3dis` (registered transform as a runnable baseline pipeline).
# Run: uv run --no-sync python train.py experiment=kpfcnn/kpfcnn-base-sm-deform_s3dis
# Benchmark pretrained: uv run --no-sync python train.py experiment=kpfcnn/kpfcnn-base-sm-deform_s3dis train=false model.pretrained=true
defaults:
  - override /data: s3dis
  - override /model: segmentation
  - override /callbacks: segmentation

trainer:
  max_epochs: 100
  precision: "32-true" # KPConv scatter ops fail under 16-mixed AMP

model:
  input_keys: [x, pos, batch]
  target_key: label
  ignore_index: -1
  name: kpfcnn-base-sm-deform.s3dis

data:
  train_dataset:
    transform: null
  val_dataset:
    transform: null
