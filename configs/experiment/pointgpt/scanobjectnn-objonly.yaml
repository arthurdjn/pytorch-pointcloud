# @package _global_
# PointGPT classification on ScanObjectNN OBJ_ONLY (no background).
# Benchmark: uv run --no-sync python test.py experiment=pointgpt/scanobjectnn-objonly
#
# | model.name                                    | accuracy | reference |
# | --------------------------------------------- | -------- | --------- |
# | pointgpt-s.scanobjectnn-objonly.guangyan-chen | 0.9071   | 0.900     |
# | pointgpt-b.scanobjectnn-objonly.guangyan-chen | 0.9518   | 0.952     |
# | pointgpt-l.scanobjectnn-objonly.guangyan-chen | 0.9690   | 0.966     |

defaults:
  - override /datamodule: scanobjectnn
  - override /model: classification
  - override /callbacks: classification

model:
  name: pointgpt-s.scanobjectnn-objonly.guangyan-chen
  num_classes: 15
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss

datamodule:
  train_dataset:
    background: false
    variant: null
  val_dataset:
    background: false
    variant: null
