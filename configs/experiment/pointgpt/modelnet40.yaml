# @package _global_
# PointGPT classification on ModelNet40 (normal-resampled), single pass (no voting).
# Benchmark: uv run --no-sync python test.py experiment=pointgpt/modelnet40
#
# | model.name                         | accuracy |
# | ---------------------------------- | -------- |
# | pointgpt-s.modelnet40.guangyan-chen    | 0.9331   |
# | pointgpt-b.modelnet40.guangyan-chen    | 0.9437   |
# | pointgpt-l.modelnet40.guangyan-chen    | 0.9388   |
# | pointgpt-s.modelnet40-8k.guangyan-chen | 0.9376   |
# | pointgpt-b.modelnet40-8k.guangyan-chen | -        |
# | pointgpt-l.modelnet40-8k.guangyan-chen | -        |
defaults:
  - override /datamodule: modelnet40_normal_resampled
  - override /model: classification
  - override /callbacks: classification

model:
  name: pointgpt-s.modelnet40.guangyan-chen
  num_classes: 40
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss
