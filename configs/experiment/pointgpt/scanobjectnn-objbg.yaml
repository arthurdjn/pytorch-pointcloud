# @package _global_
# PointGPT classification on ScanObjectNN OBJ_BG (with background).
# Benchmark: uv run --no-sync python test.py experiment=pointgpt/scanobjectnn-objbg
#
# | model.name                                  | accuracy | reference |
# | ------------------------------------------- | -------- | --------- |
# | pointgpt-s.scanobjectnn-objbg.guangyan-chen | 0.9157   | 0.916     |
# | pointgpt-b.scanobjectnn-objbg.guangyan-chen | 0.9707   | 0.958     |
# | pointgpt-l.scanobjectnn-objbg.guangyan-chen | 0.9845   | 0.972     |

defaults:
  - override /datamodule: scanobjectnn
  - override /model: classification
  - override /callbacks: classification

model:
  name: pointgpt-s.scanobjectnn-objbg.guangyan-chen
  num_classes: 15
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss

datamodule:
  train_dataset:
    background: true
    variant: null
  val_dataset:
    background: true
    variant: null
