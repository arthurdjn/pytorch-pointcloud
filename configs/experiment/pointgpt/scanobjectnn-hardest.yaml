# @package _global_
# PointGPT classification on ScanObjectNN PB_T50_RS (hardest).
# Benchmark: uv run --no-sync python test.py experiment=pointgpt/scanobjectnn-hardest
#
# | model.name                                    | accuracy | reference |
# | --------------------------------------------- | -------- | --------- |
# | pointgpt-s.scanobjectnn-hardest.guangyan-chen | 0.8695   | 0.869     |
# | pointgpt-b.scanobjectnn-hardest.guangyan-chen | 0.9192   | 0.919     |
# | pointgpt-l.scanobjectnn-hardest.guangyan-chen | 0.9375   | 0.934     |

defaults:
  - override /datamodule: scanobjectnn
  - override /model: classification
  - override /callbacks: classification

model:
  name: pointgpt-s.scanobjectnn-hardest.guangyan-chen
  num_classes: 15
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss

datamodule:
  train_dataset:
    background: true
    variant: augmentedrot_scale75
  val_dataset:
    background: true
    variant: augmentedrot_scale75
