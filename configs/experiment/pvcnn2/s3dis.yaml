# @package _global_
# PVCNN++ semantic segmentation on S3DIS Area 5.
# Train: uv run --no-sync python train.py experiment=pvcnn2/s3dis
# Benchmark: uv run --no-sync python test.py experiment=pvcnn2/s3dis
#
# | model.name         | reference (mIoU / OA) |
# | ------------------ | --------------------- |
# | pvcnn2.s3dis-area5 | 0.5902 / 0.8748       |

defaults:
  - override /datamodule: s3dis_hdf5
  - override /model: segmentation
  - override /callbacks: segmentation
  - override /inferer: sliding_window

trainer:
  max_epochs: 50
  precision: "32-true"

model:
  name: pvcnn2.s3dis-area5
  num_classes: 13
  pretrained: false
  input_keys: [x, pos, batch]
  target_key: segment
  inferer:
    block_size: 1.5
    overlap: 0.5
    dims: [0, 1]
    padding: 0.0
    roi_num_points: 8192
    softmax: true
    aggregate: max
    inverse_key: inverse
    transform:
      _target_: torch_pointcloud.transforms.Compose
      transforms:
        - _target_: torch_pointcloud.transforms.BBoxCenter
          keys: block_bbox
          dst_keys: block_center
        - _target_: torch_pointcloud.transforms.CopyItems
          keys: pos
          names: norm_pos
        - _target_: torch_pointcloud.transforms.DivideKey
          keys: norm_pos
          div_keys: coord_max
        - _target_: torch_pointcloud.transforms.SubtractKey
          keys: pos
          sub_keys: block_center
          axes: [0, 1]
        - _target_: torch_pointcloud.transforms.ToFloat
          keys: color
        - _target_: torch_pointcloud.transforms.Divide
          keys: color
          divisor: 255.0
        - _target_: torch_pointcloud.transforms.Cat
          keys: [pos, color, norm_pos]
          dst_key: x
          dim: 1
        - _target_: torch_pointcloud.transforms.DivisiblePad
          num_samples: 8192
          pad_fill: random
          dst_inverse_key: inverse
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.001
    weight_decay: 1.0e-5
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}

datamodule:
  batch_size: 32
  # One whole room per eval batch: `coord_max` is a per-room (3,) tensor.
  eval_batch_size: 1
  train_dataset:
    transform: null
  val_dataset:
    transform: null
  test_dataset:
    _target_: torch_pointcloud.datasets.S3DIS
    root: ${paths.data_dir}
    areas: [Area_5]
    aligned: false
    transform:
      _target_: torch_pointcloud.transforms.Compose
      transforms:
        - _target_: torch_pointcloud.transforms.Shift
          keys: pos
          method: min
        - _target_: torch_pointcloud.transforms.Reduce
          keys: pos
          op: max
          dst_keys: coord_max
