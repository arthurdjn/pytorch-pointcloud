# @package _global_
# Point Transformer V3 semantic segmentation on S3DIS Area 5.
# Train: uv run --no-sync python train.py experiment=point_transformer_v3/s3dis
# Benchmark: uv run --no-sync python test.py experiment=point_transformer_v3/s3dis
# Measured: blocked (the largest val rooms OOM and the Lightning test loop cannot skip a room)
defaults:
  - override /datamodule: s3dis
  - override /model: segmentation
  - override /callbacks: segmentation

trainer:
  max_epochs: 100
  # spconv/torchsparse fp16 tuner fails under 16-mixed
  precision: "32-true"

model:
  name: ptv3-base.s3dis-area5
  num_classes: 13
  pretrained: false
  input_keys: [x, pos_grid, batch]
  target_key: segment
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.006
    weight_decay: 0.05

datamodule:
  # Evaluation runs full-resolution scenes (no crop); more than one per batch exhausts a 24 GB GPU.
  eval_batch_size: 1
  train_dataset:
    transform: null
  val_dataset:
    transform: null
