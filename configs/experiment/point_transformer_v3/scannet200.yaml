# @package _global_
# Point Transformer V3 semantic segmentation on ScanNet200.
# Train: uv run --no-sync python train.py experiment=point_transformer_v3/scannet200
# Benchmark: uv run --no-sync python test.py experiment=point_transformer_v3/scannet200
#
# | model.name           | mIoU   | accuracy |
# | -------------------- | ------ | -------- |
# | ptv3-base.scannet200 | 0.3225 | 0.8334   |
defaults:
  - override /datamodule: scannet200
  - override /model: segmentation
  - override /callbacks: segmentation

trainer:
  max_epochs: 100
  # spconv/torchsparse fp16 tuner fails under 16-mixed
  precision: "32-true"

model:
  name: ptv3-base.scannet200
  num_classes: 200
  pretrained: false
  input_keys: [x, pos_grid, batch]
  target_key: segment
  criterion:
    _target_: torch.nn.CrossEntropyLoss
    ignore_index: -1
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.006
    weight_decay: 0.05

datamodule:
  train_dataset:
    transform: null
  val_dataset:
    # The benchmark script evaluates the aligned frame.
    use_axis_alignment: true
    transform: null
