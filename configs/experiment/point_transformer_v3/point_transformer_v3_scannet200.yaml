# @package _global_
# Training experiment for `ptv3-base.scannet200`. Uses the model's registered transform as a runnable baseline
# input pipeline (matches the architecture's expected features); add dataset augmentation for a
# full from-scratch run. The benchmark counterpart is point_transformer_v3_segmentation_scannet200_benchmark.
# Run: uv run --no-sync python train.py experiment=point_transformer_v3/point_transformer_v3_scannet200
# Benchmark pretrained: uv run --no-sync python train.py experiment=point_transformer_v3/point_transformer_v3_scannet200 train=false model.pretrained=true
defaults:
  - override /data: scannet200
  - override /model: segmentation
  - override /callbacks: segmentation

trainer:
  max_epochs: 100
  precision: "32-true" # spconv/torchsparse fp16 tuner fails under 16-mixed

model:
  name: ptv3-base.scannet200
  pretrained: false
  input_keys: [x, pos_grid, batch]
  target_key: segment
  criterion:
    _target_: torch.nn.CrossEntropyLoss
    ignore_index: -1
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.006
    weight_decay: 0.05

data:
  train_dataset:
    transform: null
  val_dataset:
    transform: null
