# @package _global_
# VoxelNeXt 3D object detection on nuScenes v1.0-mini.
# Benchmark: uv run --no-sync python test.py experiment=voxelnext/nuscenes
#
# | model.name                   | mAP@0.25 | mAP@0.5 |
# | ---------------------------- | -------- | ------- |
# | voxelnext-openpcdet.nuscenes | 0.5824   | 0.3855  |
defaults:
  - override /datamodule: nuscenes
  - override /model: detection
  - override /callbacks: detection

trainer:
  # the reference protocol evaluates in fp32 (spconv sparse kernels)
  precision: "32-true"

model:
  name: voxelnext-openpcdet.nuscenes
  input_keys: [voxel, pos_voxel, voxel_num_points, batch_pos_voxel]
  score_threshold: 0.1
  nms_iou: 0.2
  label_key: label

datamodule:
  batch_size: 2
  # Keep the ragged GT boxes and voxel coordinates packed (emits batch_box / batch_pos_voxel).
  cat_keys: [box, pos_voxel]
