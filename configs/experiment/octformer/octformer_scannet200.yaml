# @package _global_
# OctFormer semantic segmentation on scannet200. Octree input (BuildOctree transform + octree-merging collate).
# Benchmark pretrained: uv run --no-sync python train.py experiment=octformer/octformer_scannet200 train=false model.pretrained=true
defaults:
  - override /data: scannet200
  - override /model: segmentation
  - override /callbacks: segmentation

trainer:
  max_epochs: 100

model:
  name: octformer-base.scannet200
  num_classes: 201
  pretrained: false
  input_keys: [x, octree, octree.depth, pos, batch]
  target_key: segment
  criterion:
    _target_: torch.nn.CrossEntropyLoss
    ignore_index: 0
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.006
    weight_decay: 0.05

data:
  batch_size: 1
  train_dataset:
    transform: null
  val_dataset:
    transform: null
