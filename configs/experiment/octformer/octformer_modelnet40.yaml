# @package _global_
# OctFormer classification on ModelNet40 (mesh, octree input).
# Benchmark: uv run --no-sync python train.py experiment=octformer/octformer_modelnet40 train=false model.pretrained=true
defaults:
  - override /data: modelnet40
  - override /model: classification
  - override /callbacks: classification

trainer:
  max_epochs: 200

model:
  # OctFormerClassification.forward is model(x, octree, octree.depth) (segmentation adds pos, batch).
  input_keys: [x, octree, octree.depth]
  name: octformer-base.modelnet40

data:
  train_dataset:
    transform: null
