# @package _global_
# OctFormer classification on ModelNet40 (mesh, octree input).
# Train: uv run --no-sync python train.py experiment=octformer/modelnet40
# Benchmark: uv run --no-sync python test.py experiment=octformer/modelnet40
#
# | model.name                | accuracy |
# | ------------------------- | -------- |
# | octformer-base.modelnet40.octree-nn | 0.8902   |
defaults:
  - override /datamodule: modelnet40
  - override /model: classification
  - override /callbacks: classification

trainer:
  max_epochs: 200
  # dwconv octree kernels do not support fp16 (Half) inputs
  precision: "32-true"

model:
  name: octformer-base.modelnet40.octree-nn
  num_classes: 40
  pretrained: false
  input_keys: [x, octree, octree.depth]
  criterion:
    _target_: torch.nn.CrossEntropyLoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    weight_decay: 0.05
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_epochs}

datamodule:
  train_dataset:
    transform: null
