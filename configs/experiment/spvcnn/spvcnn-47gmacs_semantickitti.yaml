# @package _global_
# Training experiment for `spvcnn-47gmacs.semantickitti`. Uses the model's registered transform as a runnable baseline
# input pipeline (matches the architecture's expected features); add dataset augmentation for a
# full from-scratch run. The benchmark counterpart is spvcnn_segmentation_semantickitti_benchmark.
# Run: uv run --no-sync python train.py experiment=spvcnn/spvcnn_semantickitti
# Benchmark pretrained: uv run --no-sync python train.py experiment=spvcnn/spvcnn-47gmacs_semantickitti train=false model.pretrained=true
defaults:
  - override /data: semantickitti
  - override /model: segmentation
  - override /callbacks: segmentation

trainer:
  max_epochs: 100
  precision: "32-true" # spconv/torchsparse fp16 tuner fails under 16-mixed

model:
  name: spvcnn-47gmacs.semantickitti
  num_classes: 19
  pretrained: false
  input_keys: [x, pos, batch]
  target_key: segment
  criterion:
    _target_: torch.nn.CrossEntropyLoss
    ignore_index: 255
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.006
    weight_decay: 0.05

data:
  train_dataset:
    transform: null
  val_dataset:
    transform: null
