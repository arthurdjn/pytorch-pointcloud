# @package _global_
# Training experiment for `spvcnn-119gmacs.semantickitti` (registered transform as a runnable baseline pipeline).
# Run: uv run --no-sync python train.py experiment=spvcnn/spvcnn-119gmacs_semantickitti
# Benchmark pretrained: uv run --no-sync python train.py experiment=spvcnn/spvcnn-119gmacs_semantickitti train=false model.pretrained=true
defaults:
  - override /data: semantickitti
  - override /model: segmentation
  - override /callbacks: segmentation

trainer:
  max_epochs: 100
  precision: "32-true"

model:
  input_keys: [x, pos, batch]
  ignore_index: 255
  name: spvcnn-119gmacs.semantickitti

data:
  train_dataset:
    transform: null
  val_dataset:
    transform: null
