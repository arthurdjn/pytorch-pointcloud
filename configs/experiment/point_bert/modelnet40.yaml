# @package _global_
# Point-BERT classification on ModelNet40 (normal-resampled).
# Benchmark: uv run --no-sync python test.py experiment=point_bert/modelnet40
#
# | model.name                             | accuracy | reference |
# | -------------------------------------- | -------- | --------- |
# | point-bert-base.modelnet40.xumin-yu    | 0.9263   | 0.9267    |
# | point-bert-base.modelnet40-4k.xumin-yu | 0.9303   | 0.9291    |
# | point-bert-base.modelnet40-8k.xumin-yu | 0.9307   | 0.9319    |

defaults:
  - override /datamodule: modelnet40_normal_resampled
  - override /model: classification
  - override /callbacks: classification

model:
  name: point-bert-base.modelnet40.xumin-yu
  num_classes: 40
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss
