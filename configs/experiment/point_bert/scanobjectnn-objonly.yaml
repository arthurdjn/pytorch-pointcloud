# @package _global_
# Point-BERT classification on ScanObjectNN OBJ_ONLY (no background).
# Benchmark: uv run --no-sync python test.py experiment=point_bert/scanobjectnn-objonly
#
# | model.name                                    | accuracy | reference |
# | --------------------------------------------- | -------- | --------- |
# | point-bert-base.scanobjectnn-objonly.xumin-yu | 0.8812   | 0.8812    |

defaults:
  - override /datamodule: scanobjectnn
  - override /model: classification
  - override /callbacks: classification

model:
  name: point-bert-base.scanobjectnn-objonly.xumin-yu
  # The released checkpoints keep the 40-wide ModelNet head (ScanObjectNN has 15 classes); OA is the reference metric.
  num_classes: 40
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss

datamodule:
  eval_batch_size: 16
  train_dataset:
    background: false
    variant: null
  val_dataset:
    background: false
    variant: null
