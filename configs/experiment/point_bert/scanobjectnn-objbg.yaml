# @package _global_
# Point-BERT classification on ScanObjectNN OBJ_BG (with background).
# Benchmark: uv run --no-sync python test.py experiment=point_bert/scanobjectnn-objbg
#
# | model.name                         | accuracy |
# | ---------------------------------- | -------- |
# | point-bert-base.scanobjectnn-objbg.xumin-yu | 0.8744   |
defaults:
  - override /datamodule: scanobjectnn
  - override /model: classification
  - override /callbacks: classification

model:
  name: point-bert-base.scanobjectnn-objbg.xumin-yu
  # The released checkpoints keep the 40-wide ModelNet head (ScanObjectNN has 15 classes); OA is the reference metric.
  num_classes: 40
  input_keys: [x, pos, batch]
  criterion:
    _target_: torch.nn.CrossEntropyLoss

datamodule:
  train_dataset:
    background: true
    variant: null
  val_dataset:
    background: true
    variant: null
