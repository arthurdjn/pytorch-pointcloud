[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torch_pointcloud"]

[tool.hatch.build.targets.sdist]
include = ["/src/torch_pointcloud", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/README.md", "/pyproject.toml"]

[project]
name = "torch-pointcloud"
version = "0.1.0"
description = "PyTorch Point Cloud models, scripts, pretrained weights and more"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Arthur Dujardin", email = "arthurdujardin.dev@gmail.com" }]
keywords = ["pytorch", "point cloud", "3d", "deep learning", "segmentation", "detection", "pretrained models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.15.1",
    "joblib>=1.4.2",
    "numpy>=2.0.0",
    "packaging>=23.0",
    "pandas>=2.2.3",
    "pillow>=10.0.0",
    "plyfile>=1.1",
    "safetensors>=0.7.0",
    "scipy>=1.10.0",
    # `torch.serialization.safe_globals` (dataset cache loads) requires torch 2.5.
    "torch>=2.5.0,<3.0.0",
    "torch-geometric>=2.6.1",
    "tqdm>=4.67.1",
    "typing-extensions>=4.10.0",
]

[project.urls]
Homepage = "https://github.com/arthurdjn/pytorch-pointcloud"
Repository = "https://github.com/arthurdjn/pytorch-pointcloud"
Issues = "https://github.com/arthurdjn/pytorch-pointcloud/issues"

[project.optional-dependencies]
lightning = ["lightning>=2.0.0,<2.6.0", "torchmetrics>=1.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-markdown-docs>=0.6.0",
    "ruff>=0.9.1",
    "ipykernel>=6.29.5",
    "mkdocs-jupyter>=0.25.1",
    "mkdocs-exclude>=1.0.2",
    "nbconvert>=7.16.5",
    "mkdocstrings>=0.27.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.50",
    "mkdocstrings-python>=1.13.0",
    "types-requests>=2.32.0.20241016",
    "mypy>=1.19.0",
    "zensical>=0.0.50",
    # `aim` pulls in `aimrocks`, which ships wheels only for cp310/311/312.
    "aim>=3.20.0 ; python_version < '3.13'",
    "tensorboard>=2.14.0",
    "mlflow>=2.10.0",
    "ipywidgets>=8.1.8",
]

[tool.uv]
package = true
exclude-newer = "14 days"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/**/__init__.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["torch_pointcloud"]

[tool.mypy]
untyped_calls_exclude = "torch"
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true
check_untyped_defs = true
implicit_reexport = true
# Because multiple files in the tests/data/**/scripts have the same name
exclude = ["tests/data/", "notebooks", "docs"]

[tool.pytest.ini_options]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
