[project]
name = "torch-pointcloud"
version = "0.1.0"
description = "PyTorch Point Cloud models, scripts, pretrained weights and more"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.15.1",
    "joblib>=1.4.2",
    "numpy>=2.0.0",
    "pandas>=2.2.3",
    "plyfile>=1.1",
    "python-dotenv>=1.2.2",
    "safetensors>=0.7.0",
    "torch>=2.0.0,<3.0.0",
    "torch-geometric>=2.6.1",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
torchsparse = [
    "torchsparse @ git+https://github.com/mit-han-lab/torchsparse.git",
]
ocnn = ["ocnn>=2.2.6"]
dwconv = ["dwconv @ git+https://github.com/octree-nn/dwconv.git"]
build = ["setuptools", "wheel", "rootpath"]
flash-attn = ["flash-attn>=2.4.1"]
mamba = ["mamba-ssm[causal-conv1d]>=2.2.0"]
spconv = ["spconv>=2.2.1"]
pyg-lib = ["torch-scatter>=2.1.2", "torch-cluster>=1.6.3"]
lightning = ["lightning>=2.0.0,<2.6.0", "torchmetrics>=1.0.0"]

[dependency-groups]
# PEP 735 dev group (replaces the deprecated `[tool.uv].dev-dependencies`).
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.1",
    "ipykernel>=6.29.5",
    "mkdocs-jupyter>=0.25.1",
    "mkdocs-exclude>=1.0.2",
    "nbconvert>=7.16.5",
    "mkdocstrings>=0.27.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.50",
    "mkdocstrings-python>=1.13.0",
    "types-requests>=2.32.0.20241016",
    "mypy>=1.19.0",
    "zensical>=0.0.41",
    "hydra-core>=1.3.0",
    # `aim` pulls in `aimrocks`, which ships wheels only for cp310/311/312.
    # Skip on Python 3.13+ so CI installs cleanly; tensorboard + mlflow stay.
    "aim>=3.20.0 ; python_version < '3.13'",
    "tensorboard>=2.14.0",
    "mlflow>=2.10.0",
]

[tool.uv]
package = true
find-links = ["https://data.pyg.org/whl/torch-2.6.0+cpu.html"]
no-build-isolation-package = ["flash-attn", "torchsparse"]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.4.1"
requires-dist = ["torch", "einops", "setuptools"]

[[tool.uv.dependency-metadata]]
name = "torchsparse"
version = "2.1.0"
requires-dist = ["torch", "setuptools", "rootpath", "wheel"]

[[tool.uv.dependency-metadata]]
name = "dwconv"
version = "1.1.0"
requires-dist = ["torch"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/**/__init__.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["torch_pointcloud"]

[tool.mypy]
untyped_calls_exclude = "torch"
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true
check_untyped_defs = true
implicit_reexport = true
# Because multiple files in the tests/data/**/scripts have the same name
exclude = ["tests/data/", "notebooks", "docs"]
