name: "Feature Request"
description: "Propose a new feature, model, dataset or pretrained checkpoint"
labels: feature

body:
  - type: textarea
    attributes:
      label: The feature, motivation and pitch
      description: >
        A clear and concise description of the feature proposal. 
        Please outline the motivation for the proposal. 
        Is your feature request related to a specific problem? 
        e.g., *"I'm working on X and would like Y to be possible"*. 
        For a new model or checkpoint, please link the paper, 
        the reference implementation and the license of its code and weights. 
        If this is related to another GitHub issue, please link here too.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      description: >
        A description of any alternative solutions or features you've considered, if any.
  - type: textarea
    attributes:
      label: Additional context
      description: >
        Add any other context or screenshots about the feature request.
