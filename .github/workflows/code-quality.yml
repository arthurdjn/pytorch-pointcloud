name: Code Quality

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install package + dev tools
        run: uv sync --frozen

      - name: Install torch stack (CPU)
        run: |
          uv pip install --no-config --torch-backend=cpu \
            torch==2.6.0 torchvision==0.21.0 'ocnn==2.2.8' torch-scatter torch-cluster spconv \
            -f https://data.pyg.org/whl/torch-2.6.0+cpu.html

      - name: Check types
        if: ${{ always() }}
        run: uv run --no-sync mypy src tests examples

      - name: Check linting
        if: ${{ always() }}
        run: uv run --no-sync ruff check src tests examples

      - name: Check imports
        if: ${{ always() }}
        run: uv run --no-sync ruff check src tests examples --select I

      - name: Check formatting
        if: ${{ always() }}
        run: uv run --no-sync ruff format src tests examples --check
