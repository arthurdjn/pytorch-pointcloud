name: Code Quality

on: push

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: 3.11

      - name: Check types
        run: uv run mypy src tests examples

      - name: Run linter
        run: uv run ruff check src tests examples

      - name: Run formatter
        run: uv run ruff format src tests examples --check

      - name: Check imports
        run: uv run ruff check --select I src tests examples
