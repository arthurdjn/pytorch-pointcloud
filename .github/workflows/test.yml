name: Tests

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Light tests with no extras (tests requiring extras should be skipped and core components should work)
  # This ensure that optional imports are wrapped with `optional_import`, such that importing them
  # does not raise an ImportError (only when using it).
  light:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install all dependencies
        run: uv sync --dev --frozen

      - name: Test (light) with python ${{ matrix.python-version }}
        run: uv run --frozen pytest

  # Full tests with all extras (except non-regression tests with pretrained models)
  # Here most of optional imports are installed depending on the runner's capabilities.
  full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + extras (torch==2.6.0)
        run: uv sync --extra lightning --frozen

      - name: Install torch
        run: uv pip install --no-config torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install torchvision
        if: matrix.python-version != '3.13'
        run: uv pip install --no-config torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install ocnn
        if: matrix.python-version != '3.13'
        run: uv pip install --no-deps 'ocnn==2.2.8'

      - name: Install torch-scatter + torch-cluster
        if: matrix.python-version != '3.13'
        run: uv pip install torch-scatter torch-cluster -f https://data.pyg.org/whl/torch-2.6.0+cpu.html

      - name: Install spconv
        run: uv pip install spconv

      - name: Test with python ${{ matrix.python-version }}
        run: uv run --frozen pytest
