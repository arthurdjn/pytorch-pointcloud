name: Tests

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  # Light tests with no extras (tests requiring extras should be skipped and core components should work)
  # This ensure that optional imports are wrapped with `optional_import`, such that importing them
  # does not raise an ImportError (only when using it).
  light:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # WIP: reduced to 3.10 only to save CI minutes
        python-version: ["3.10"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install all dependencies
        run: uv sync --dev --frozen

      - name: Test (light) with python ${{ matrix.python-version }}
        run: uv run --frozen pytest

  # Full tests with all extras (except non-regression tests with pretrained models)
  # Here most of optional imports are installed depending on the runner's capabilities.
  full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # WIP: reduced to 3.10 only to save CI minutes
        python-version: ["3.10"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + extras (torch==2.6.0)
        run: uv sync --extra lightning --frozen

      - name: Install torch deps (python < 3.13)
        if: matrix.python-version != '3.13'
        run: |
          uv pip install --no-config --torch-backend=cpu \
            torch==2.6.0 torchvision==0.21.0 'ocnn==2.3.2' torch-scatter torch-cluster spconv \
            -f https://data.pyg.org/whl/torch-2.6.0+cpu.html

      # python 3.13: torchvision / ocnn / pyg have no 3.13 wheels yet, so install only torch + spconv.
      - name: Install torch deps (python == 3.13)
        if: matrix.python-version == '3.13'
        run: uv pip install --no-config --torch-backend=cpu torch==2.6.0 spconv

      - name: Test with python ${{ matrix.python-version }}
        run: uv run --no-sync pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install all dependencies
        run: uv sync --dev --frozen

      - name: Doctests in source docstrings
        run: uv run --frozen pytest --doctest-modules src

      - name: Doctests in documentation code blocks
        run: uv run --frozen pytest --markdown-docs --markdown-docs-syntax=superfences src docs --ignore=docs/scripts --ignore=docs/examples --ignore=src/torch_pointcloud/lightning

  # Package gate: build the distributions, keep the sdist under PyPI's 100 MB upload limit, and
  # import from a bare wheel install (no dev group, no extras) so an undeclared runtime
  # dependency fails here instead of on a user's machine.
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Build the wheel and sdist
        run: uv build

      - name: Check the sdist size against the PyPI upload limit
        run: |
          size=$(stat -c%s dist/*.tar.gz)
          echo "sdist: $size bytes"
          test "$size" -lt 100000000

      - name: Import from a bare wheel install
        run: |
          uv venv .venv-bare
          VIRTUAL_ENV=$PWD/.venv-bare uv pip install --torch-backend=cpu dist/*.whl
          .venv-bare/bin/python -c "import torch_pointcloud; print(torch_pointcloud.__name__)"
