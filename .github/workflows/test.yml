name: Tests

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Add ocnn dependency for python ${{ matrix.python-version }}
        # NOTE: ocnn depends on torchvision, which is not fully compatible with python 3.13 yet
        if: matrix.python-version != '3.13'
        run: uv sync --extra ocnn

      - name: Install torch-geometric dependencies (torch==2.6.0)
        # NOTE: `pyg-lib` has no wheels for python 3.13 yet
        if: matrix.python-version != '3.13'
        run: uv sync --extra pyg-lib

      - name: Install spconv dependency
        run: uv sync --extra spconv

      - name: Install flash-attn dependency
        if: runner.os == 'Linux' && contains(runner.name, 'gpu')
        run: uv sync --extra flash-attn

      - name: Test with python ${{ matrix.python-version }}
        run: uv run --frozen pytest
