name: PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the title starts with a capital letter
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^[[:upper:][:digit:]] ]]; then
            echo "::error::The pull request title \"$TITLE\" must start with a capital letter, e.g. \"Add a PLY reader\"."
            exit 1
          fi
