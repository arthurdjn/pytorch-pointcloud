name: Docs

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install project and docs tooling (torch==2.6.0)
        run: |
          uv add torch==2.6.0
          uv sync --frozen

      # Pinned to 2.2.8: ocnn 2.3.x probes the triton GPU driver at import and fails on these CPU runners.
      - name: Install ocnn
        run: uv pip install 'ocnn==2.2.8'

      - name: Install torch-scatter + torch-cluster (pyg-lib)
        run: uv pip install torch-scatter torch-cluster -f https://data.pyg.org/whl/torch-2.6.0+cpu.html

      - name: Install spconv
        run: uv pip install spconv

      - name: Build documentation
        run: uv run --frozen zensical build
