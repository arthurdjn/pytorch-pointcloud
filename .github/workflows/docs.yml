name: Docs

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install project and docs tooling
        # Extras match code-quality + what API pages import (e.g. spconv, ocnn) so mkdocstrings
        # can load modules. flash-attn omitted (no CUDA on runners).
        run: |
          uv add torch==2.6.0
          uv sync --extra spconv --extra ocnn --extra pyg-lib --frozen

      - name: Build documentation
        run: uv run --frozen zensical build
