name: Docs

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install package + docs tooling
        run: uv sync --frozen --dev

      - name: Install torch deps
        run: |
          uv pip install --no-config --torch-backend=cpu \
            torch==2.6.0 torchvision==0.21.0 'ocnn==2.3.2' torch-scatter torch-cluster spconv \
            -f https://data.pyg.org/whl/torch-2.6.0+cpu.html

      - name: Build documentation
        run: uv run --no-sync zensical build
