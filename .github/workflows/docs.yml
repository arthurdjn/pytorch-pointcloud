name: Docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install the package and the docs tooling
        run: uv sync --frozen --dev

      - name: Install the CPU torch extensions
        run: |
          uv pip install --no-config --torch-backend=cpu \
            torch==2.6.0 torchvision==0.21.0 'ocnn==2.3.2' torch-scatter torch-cluster spconv \
            -f https://data.pyg.org/whl/torch-2.6.0+cpu.html

      - name: Render the notebooks and the API reference
        run: |
          uv run --no-sync python docs/scripts/build_notebooks.py
          uv run --no-sync python docs/scripts/build_api_reference.py torch_pointcloud --out docs/api

      - name: Build the site
        run: JUPYTER_PLATFORM_DIRS=1 uv run --no-sync zensical build --strict

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
